name: House import

on:
  workflow_dispatch:
    inputs:
      year:
        description: Filing year
        default: "2026"
      limit:
        description: Max new filings to process (blank = all)
        default: "25"
      debug_docs:
        description: Space-separated DocIDs to dump extracted text for (skips the import)
        default: ""

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt reportlab
      - name: Dump extracted text for specific filings
        if: ${{ inputs.debug_docs != '' }}
        shell: bash
        run: |
          for d in ${{ inputs.debug_docs }}; do
            python house_importer.py --year "${{ inputs.year }}" --debug "$d" > "debug_$d.log" 2>&1 || true
          done
      - name: Test, ingest committees, import House PTRs
        if: ${{ inputs.debug_docs == '' }}
        shell: bash
        run: |
          {
            python tests/test_house_importer.py
            python ingest_committees.py
            python house_importer.py --year "${{ inputs.year }}" ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
            python - <<'PY'
          import db
          c = db.connect()
          print("filings by status:", [tuple(r) for r in c.execute("select status, count(*) from filings group by status")])
          print("partial / no_text examples (doc_id, filer, status, parsed, markers):")
          for r in c.execute("select doc_id, filer, status, rows_parsed, markers from filings where status in ('partial','no_text') limit 8"):
              print("  ", tuple(r))
          print("sample trades (member, date, ticker, asset, type, owner, amount):")
          for r in c.execute("select m.name, t.tx_date, t.ticker, t.asset, t.tx_type, t.owner, t.amount_label from trades t join members m using(bioguide_id) order by t.id limit 15"):
              print("  ", tuple(r))
          PY
          } 2>&1 | tee run.log
      - name: Publish logs as annotations
        if: always()
        run: |
          python - <<'PY'
          import glob, os
          for path in ["run.log"] + sorted(glob.glob("debug_*.log")):
              if not os.path.exists(path):
                  continue
              lines = open(path, errors="replace").read().splitlines()
              lines = lines[:90] if path.startswith("debug_") else lines[-70:]
              body = "\n".join(l[:200] for l in lines)[:9000]
              body = body.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::notice title={path}::{body}")
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.debug_docs == '' }}
        with:
          name: congress-db
          path: congress.db
